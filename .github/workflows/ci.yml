name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push supersedes the run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The toolchain the module declares, not a pinned duplicate.
          go-version-file: go.mod
          cache: true

      # Unit tests only (testify + mockery); no Postgres, Redis, or SMTP needed.
      - run: make test

  client-test:
    name: Client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run test
        env:
          TURBO_TELEMETRY_DISABLED: "1"
