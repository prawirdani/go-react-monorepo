name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push supersedes the run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The toolchain the module declares, not a pinned duplicate.
          go-version-file: backend/go.mod
          cache: true

      # Unit tests only (testify + mockery); no Postgres, Redis, or SMTP needed.
      - run: make test

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      # Pin the same major the Makefile and .golangci.yml target (v2).
      # Action v7+ is required for golangci-lint v2.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          # The Makefile scopes packages (GO_PACKAGES) so node_modules under
          # client/ is never walked; reuse that recipe instead of ./....
          args: ./cmd/... ./internal/... ./pkg/... ./config/...

  client:
    name: Client lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run test

      # The one gate that catches the tsc step in `vite build && tsc`; without
      # it a type error ships green.
      - run: bun run build
