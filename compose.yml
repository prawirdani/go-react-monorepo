# Self-contained stack: Postgres, Redis, API, worker, migrate, Caddy, Prometheus
# and Grafana all run inside this compose project. No host services are required
# and there is no host bridge (extra_hosts / host.docker.internal) to configure.
#
# Only Caddy publishes ports, so it is the single internet-facing entry point.
# Every service joins the pinned `app-net` bridge — which also means Caddy,
# Prometheus and Grafana can reach the datastores. Give Postgres and Redis their
# own `internal: true` network if you want that segmentation.
#
# The subnet is pinned (APP_NET_SUBNET) so the API can name a deterministic
# trusted proxy CIDR (the project's own network, not Docker's whole pool).
#
# Every service loads .env via `env_file:`, so credentials are defined once. A
# container's own `environment:` block still wins for the keys it must override
# (service hostnames, ports). Note this also hands every container the entire
# file, secrets included — see the README for the trade-off.
services:
  api:
    build:
      context: .
    image: golang-restapi:local
    restart: always
    networks: [app-net]
    env_file:
      - .env
    # Override the bare-metal defaults from .env (DB_HOST/REDIS_HOST=localhost)
    # so the app talks to the compose services instead of the host.
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # Fixed exporter port, so Prometheus never has to track APP_PORT.
      METRICS_PORT: ${METRICS_PORT:-9091}
      # Empty in .env means "follow APP_ENV" for bare-metal; the stack always
      # wants an exporter, so default it on here — but let .env turn it off.
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      # Trust Caddy's X-Forwarded-For (the proxy sits on the same network) so
      # the audit log records the real client IP instead of the proxy's address.
      # This is deliberately the project's own pinned subnet, NOT Docker's whole
      # default pool (172.16.0.0/12): Caddy is the only hop that should ever be
      # trusted, and a wider CIDR would trust unrelated containers on the host.
      TRUSTED_PROXIES: ${APP_NET_SUBNET:-172.28.0.0/24}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Schema must exist before the API serves a request.
      migrate:
        condition: service_completed_successfully

  # Polls the transactional outbox table and delivers due messages (SMTP).
  # Same image as the API; only the entrypoint differs.
  worker:
    build:
      context: .
    image: golang-restapi:local
    command: ["./worker"]
    restart: always
    networks: [app-net]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    # The worker only touches Postgres (outbox); it never uses Redis, so no
    # redis dependency.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    networks: [app-net]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-golang-restapi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published. For pgAdmin / psql from outside, uncomment the loopback
    # mapping and tunnel it — `ssh -L 5432:127.0.0.1:5432 user@host`.
    # Never publish on 0.0.0.0: Docker publishes bypass ufw, so that would put
    # the database on the internet.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USER:-postgres}\" -d \"${DB_NAME:-golang-restapi}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    networks: [app-net]
    # The sh wrapper below bypasses the image entrypoint's gosu drop, so pin the
    # container user explicitly (keeps Redis off root).
    user: redis
    # REDIS_PASSWORD must exist *inside the container* for the shell expansion
    # below and for the healthcheck. Compose interpolation alone only reads it
    # to build this file — it does not inject it, which silently left Redis
    # unauthenticated.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Compose cannot branch on ${REDIS_PASSWORD}, so let the shell decide: the
    # parameter expansion adds --requirepass only when REDIS_PASSWORD is non-empty
    # ($$ escapes compose interpolation; the value arrives via the env above).
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticate only when a password is configured, otherwise plain ping.
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot goose migration job. It runs after Postgres is healthy and before
  # the API and worker start, so neither ever sees an empty schema.
  #
  # The image's entrypoint hardcodes `-dir=/migrations` and runs
  # `goose ${GOOSE_VERBOSE:+-v} -dir=/migrations ${GOOSE_COMMAND:-up}`, so only
  # GOOSE_DRIVER/GOOSE_DBSTRING are needed here — no command or entrypoint.
  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.19.2
    env_file:
      - .env
    networks: [app-net]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=${DB_PORT:-5432}
        user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot: never restart, and a failure must block the app tier.
    restart: "no"

  # Nightly logical backups. The sidecar gets pg_dump/pg_restore from the
  # postgres image and rclone from apk, and runs busybox crond. Dumps land in
  # the host-mounted `backups/` dir — same host, so they are NOT offsite.
  #
  # Set BACKUP_R2_BUCKET to a SEPARATE, PRIVATE R2 bucket for offsite copies.
  # It must never be R2_BUCKET: that bucket is served from a public URL, and
  # the script hard-refuses to upload to it.
  backup:
    build:
      context: ./deployment/backup
    image: golang-restapi-backup:local
    entrypoint: ["crond", "-f", "-l", "8"]
    networks: [app-net]
    env_file:
      - .env
    environment:
      # .env sets DB_HOST=localhost for bare-metal; inside compose the database
      # is the `postgres` service.
      DB_HOST: postgres
    volumes:
      - ./deployment/backup/crontab:/etc/crontabs/root:ro
      - ./deployment/backup/backup-postgres.sh:/backup-postgres.sh:ro
      - ./backups:/backups
    # No published ports: nothing needs to reach the backup sidecar.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    env_file:
      - .env
    networks: [app-net]
    environment:
      # ":80" (the default) serves plain HTTP on the mapped host port. Point
      # SITE_ADDRESS at a real domain to turn on automatic HTTPS — and then
      # publish CADDY_HTTP_PORT=80 and CADDY_HTTPS_PORT=443 on the host, or the
      # ACME challenge cannot be answered.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Upstream port in the Caddyfile; it is the API's container port, not a
      # published one — the API is never reachable except through this proxy.
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      # Caddyfile is selectable via env. Set CADDYFILE=Caddyfile.cloudflare when
      # Cloudflare fronts the proxy (run update-cloudflare-ips.sh first).
      - ./deployment/caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: prometheus
    env_file:
      - .env
    networks: [app-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    env_file:
      - .env
    networks: [app-net]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Hardcoded on purpose: these two are security hardening, not preferences.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deployment/grafana/provisioning/:/etc/grafana/provisioning
      - ./deployment/grafana/dashboards/:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only: reach Grafana through an SSH tunnel instead of exposing
      # its admin login to the internet. Docker publishes bypass ufw, so this
      # mapping — not the host firewall — is what keeps it private.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  # Pinned subnet so the API can name a deterministic trusted proxy CIDR
  # (${APP_NET_SUBNET}) instead of trusting Docker's whole address pool.
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NET_SUBNET:-172.28.0.0/24}

volumes:
  caddy-config:
  caddy-data:
  grafana-data:
  postgres-data:
  prometheus-data:
  redis-data:
