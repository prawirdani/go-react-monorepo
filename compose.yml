# Self-contained stack: Postgres, Redis, API, worker, nginx, Prometheus and Grafana
# all run inside this compose project. No host services are required and there is
# no host bridge (extra_hosts / host.docker.internal) to configure.
services:
  api:
    build:
      context: .
    image: golang-restapi:local
    expose:
      - "${APP_PORT:-8080}"
    restart: always
    env_file:
      - .env
    # Override the bare-metal defaults from .env (DB_HOST/REDIS_HOST=localhost)
    # so the app talks to the compose services instead of the host.
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      APP_BIND_ADDR: 0.0.0.0
      METRICS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  # Polls the transactional outbox table and delivers due messages (SMTP).
  # Same image as the API; only the entrypoint differs.
  worker:
    build:
      context: .
    image: golang-restapi:local
    command: ["./worker"]
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      APP_BIND_ADDR: 0.0.0.0
      METRICS_ENABLED: "true"
    # Worker only touches Postgres (outbox), never Redis, so no redis dependency.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-golang-restapi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USER:-postgres}\" -d \"${DB_NAME:-golang-restapi}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    # The sh wrapper below bypasses the image entrypoint's gosu drop, so pin the
    # container user explicitly (keeps Redis off root).
    user: redis
    # Compose cannot branch on ${REDIS_PASSWORD}, so let the shell decide: the
    # parameter expansion adds --requirepass only when REDIS_PASSWORD is non-empty
    # ($$ escapes compose interpolation; REDIS_PASSWORD is loaded via env_file).
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticate only when a password is configured, otherwise plain ping.
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-net

  nginx:
    image: nginx:1.29.3-trixie
    container_name: nginx
    ports:
      - "8080:80"
      - "8181" # For status
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - nginx-logs:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: prometheus
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - app-net

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin # Admin username
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin} # Admin password
    volumes:
      - ./deployment/grafana/provisioning/:/etc/grafana/provisioning
      - ./deployment/grafana/dashboards/:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - app-net

volumes:
  nginx-logs:
  postgres-data:
  redis-data:

networks:
  app-net:
    driver: bridge
