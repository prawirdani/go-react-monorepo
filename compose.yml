services:
  api:
    build:
      context: .
    image: golang-restapi:local
    expose:
      - "${APP_PORT:-8080}"
    restart: always
    env_file:
      - .env
    # Remove this if rolling up postgres inside this compose, its only for bridging container to host because my postgres run on host level
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Polls the transactional outbox table and delivers due messages (SMTP).
  # Same image as the API; only the entrypoint differs.
  worker:
    build:
      context: .
    image: golang-restapi:local
    command: ["./worker"]
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.29.3-trixie
    container_name: nginx
    ports:
      - "8080:80"
      - "8181" # For status
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: prometheus
    ports:
      - "9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:main
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin # Admin username
      - GF_SECURITY_ADMIN_PASSWORD=admin # Admin password
    volumes:
      - ./deployment/grafana/provisioning/:/etc/grafana/provisioning
      - ./deployment/grafana/dashboards/:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  nginx-logs:
