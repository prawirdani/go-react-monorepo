# Self-contained stack behind Caddy: Postgres, Redis, API, worker, the cli
# container (migrations + backups) and Caddy all run inside this compose project.
# No host services are required and there is no host bridge (extra_hosts /
# host.docker.internal) to configure.
#
#   docker compose up -d
#
# Prometheus and Grafana are behind the `observability` profile, so a plain
# `up -d` does not start them. Opt in when you want dashboards:
#
#   docker compose --profile observability up -d
#
# For a bare API with no bundled proxy (you terminate TLS / reverse-proxy
# yourself, e.g. a host nginx), use compose.minimal.yml instead.
#
# Only Caddy publishes ports, so it is the single internet-facing entry point.
# The API is never published - it is reachable only by Caddy over the private
# `app-net` bridge, which is the trust boundary (not an IP allowlist). Every
# service joins that bridge, which also means Caddy, Prometheus and Grafana can
# reach the datastores. Give Postgres and Redis their own `internal: true`
# network if you want that segmentation.
#
# Every service loads .env via `env_file:`, so credentials are defined once. A
# container's own `environment:` block still wins for the keys it must override
# (service hostnames, ports). Note this also hands every container the entire
# file, secrets included - see the README for the trade-off.
services:
  api:
    build:
      context: ./backend
    image: go-react-monorepo:local
    restart: always
    # Drain budget is 25s; 40s gives shutdown room under Docker's 10s default.
    stop_grace_period: 40s
    networks: [app-net]
    env_file:
      - .env
    # Override the bare-metal defaults from .env (DB_HOST/REDIS_HOST=localhost)
    # so the app talks to the compose services instead of the host.
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # Fixed exporter port, so Prometheus never has to track APP_PORT.
      METRICS_PORT: ${METRICS_PORT:-9091}
      # Empty in .env means "follow APP_ENV" for bare-metal; the stack always
      # wants an exporter, so default it on here - but let .env turn it off.
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      # Trust the reverse proxy's X-Forwarded-For so the audit log records the
      # real client IP. Safe because the API is unpublished: the only peer that
      # can reach it is Caddy on the private bridge, so no client can forge the
      # header. The app trusts the peer class (private/loopback/unix), not a
      # baked CIDR, so this one flag is all the stack needs.
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Schema must exist before the API serves a request.
      cli:
        condition: service_healthy

  # Polls the transactional outbox table and delivers due messages (SMTP).
  # Same image as the API; only the entrypoint differs.
  worker:
    build:
      context: ./backend
    image: go-react-monorepo:local
    command: ["./worker"]
    restart: always
    # Same 25s drain budget as the API; 40s beats Docker's 10s default.
    stop_grace_period: 40s
    networks: [app-net]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    # The worker only touches Postgres (outbox); it never uses Redis, so no
    # redis dependency.
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_healthy

  postgres:
    image: postgres:18.1
    env_file:
      - .env
    networks: [app-net]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go-react-monorepo}
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker, so the volume
      # mounts at /var/lib/postgresql rather than /var/lib/postgresql/data. An
      # existing volume holds a 17 cluster at its root, which this image will not
      # read - it runs initdb instead, yielding an empty database. See
      # DEPLOYMENT.md, "Upgrading PostgreSQL across a major version".
      - postgres-data:/var/lib/postgresql
    # Not published. For pgAdmin / psql from outside, uncomment the loopback
    # mapping and tunnel it - `ssh -L 5432:127.0.0.1:5432 user@host`.
    # Never publish on 0.0.0.0: Docker publishes bypass ufw, so that would put
    # the database on the internet.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "${DB_USER:-postgres}" -d "${DB_NAME:-go-react-monorepo}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.6.2
    env_file:
      - .env
    networks: [app-net]
    # The sh wrapper below bypasses the image entrypoint's gosu drop, so pin the
    # container user explicitly (keeps Redis off root).
    user: redis
    # REDIS_PASSWORD must exist *inside the container* for the shell expansion
    # below and for the healthcheck. Compose interpolation alone only reads it
    # to build this file - it does not inject it, which silently left Redis
    # unauthenticated.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Compose cannot branch on ${REDIS_PASSWORD}, so let the shell decide: the
    # parameter expansion adds --requirepass only when REDIS_PASSWORD is non-empty
    # ($$ escapes compose interpolation; the value arrives via the env above).
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticate only when a password is configured, otherwise plain ping.
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One long-running CLI container: it applies migrations at start, writes the
  # /app/.migrated readiness marker, then runs busybox crond for the twice-daily
  # backups. Migration failure stops it after 3 attempts, so the app tier - which
  # waits on this service being healthy - never boots against a stale schema.
  #
  # The cli image has no goose entrypoint and needs no -dir mount: the goose SQL
  # is embedded in the binary, so `./cli --migrate up` applies it. It reads the
  # DB_* variables from .env; only the host needs overriding.
  #
  # Backups are twice-daily and offsite-only: one busybox-crond job runs
  # `cli --backup`, which streams `pg_dump -Fc` straight to the private R2 bucket
  # through the S3 SDK. There is no temp file, no rclone, no local copy and no
  # on-host volume. Retention is an R2 lifecycle rule on BACKUP_PREFIX, not pruned
  # here.
  #
  # The crontab is baked at /etc/crontabs/root (busybox's default). cron does not
  # inherit the container environment, so the entrypoint snapshots the DB_* and
  # BACKUP_R2_* variables into /etc/backup.env, which the job sources.
  #
  # BACKUP_R2_BUCKET must be a SEPARATE, PRIVATE R2 bucket. It must never be
  # R2_BUCKET: that bucket is served from a public URL, and the CLI hard-refuses
  # to upload to it.
  cli:
    build:
      context: ./backend
      target: cli
    image: go-react-monorepo-cli:local
    env_file:
      - .env
    networks: [app-net]
    environment:
      # .env sets DB_HOST=localhost for bare-metal; inside compose the database
      # is the `postgres` service.
      DB_HOST: postgres
      # cron fires in the container's local time; pin it so "03:15" and "15:15" are known
      # wall clock rather than UTC.
      TZ: ${TZ:-Asia/Jakarta}
    # No published ports and no volumes: it only reaches the database and R2, and
    # keeps nothing on the host.
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy once migrations are applied and crond is up. The api and worker
    # wait on this, and the crond check matters because a dead scheduler has no
    # other symptom: there is no backup freshness alert.
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/.migrated && pgrep -f 'crond -f' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # Give up after 3 attempts: a permanent migration error must block the app
    # tier, not loop forever.
    restart: "on-failure:3"

  # Builds the dashboard from client/ and serves it alongside the API. The
  # Dockerfile lives in deployment/caddy/ but its context is client/, so every
  # COPY in it resolves inside that directory. Bare-metal development does not
  # use this image - `make client:dev` runs Vite directly.
  caddy:
    build:
      context: ./client
      dockerfile: ../deployment/caddy/Dockerfile
      args:
        # Vite inlines these into the bundle at build time. VITE_API_URL stays
        # empty for the same-origin setup the Caddyfile provides; VITE_IMAGE_URL
        # is the public asset base for uploads and falls back to the R2 bucket
        # URL, which is the same server.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_IMAGE_URL: ${VITE_IMAGE_URL:-${R2_BUCKET_URL:-}}
    image: go-react-monorepo-caddy:local
    env_file:
      - .env
    networks: [app-net]
    environment:
      # ":80" (the default) serves plain HTTP on the mapped host port. Point
      # SITE_ADDRESS at a real domain to turn on automatic HTTPS - and then
      # publish CADDY_HTTP_PORT=80 and CADDY_HTTPS_PORT=443 on the host, or the
      # ACME challenge cannot be answered.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Upstream port in the Caddyfile; it is the API's container port, not a
      # published one - the API is never reachable except through this proxy.
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      # Caddyfile is selectable via env. Set CADDYFILE=Caddyfile.cloudflare when
      # Cloudflare fronts the proxy (run update-cloudflare-ips.sh first).
      - ./deployment/caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: prometheus
    # Opt-in: a plain `docker compose up -d` runs only the app tier.
    profiles: ["observability"]
    env_file:
      - .env
    networks: [app-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    # Opt-in with `--profile observability`, same as Prometheus.
    profiles: ["observability"]
    env_file:
      - .env
    networks: [app-net]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Hardcoded on purpose: these two are security hardening, not preferences.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deployment/grafana/provisioning/:/etc/grafana/provisioning
      - ./deployment/grafana/dashboards/:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only: reach Grafana through an SSH tunnel instead of exposing
      # its admin login to the internet. Docker publishes bypass ufw, so this
      # mapping - not the host firewall - is what keeps it private.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  app-net:
    driver: bridge

volumes:
  caddy-config:
  caddy-data:
  grafana-data:
  postgres-data:
  prometheus-data:
  redis-data:
