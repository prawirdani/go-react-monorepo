# Bare API stack: Postgres, Redis, API, worker, migrate and the backup sidecar.
# No bundled reverse proxy, TLS, or dashboards — you front it yourself (a host
# nginx, a cloud load balancer, etc.) and serve the built client however you
# like.
#
#   docker compose -f compose.minimal.yml up -d
#
# The default compose.yml is the self-contained stack that also runs Caddy,
# Prometheus and Grafana.
#
# The API publishes on 127.0.0.1 only, so it is reachable from the host's own
# proxy but never directly from the internet (Docker publishes bypass ufw, so
# the loopback bind — not the firewall — is what keeps it private). Point your
# proxy's upstream at 127.0.0.1:${APP_PORT}.
#
# Client IPs: set TRUST_PROXY=true once a reverse proxy fronts the API, so the
# audit log records the real client from X-Forwarded-For instead of the proxy.
# Leave it false (the default) for a directly-reachable API — trusting the
# header with no proxy in front lets a caller forge its own IP.
services:
  api:
    build:
      context: .
    image: go-react-monorepo:local
    restart: always
    networks: [app-net]
    env_file:
      - .env
    # Override the bare-metal defaults from .env (DB_HOST/REDIS_HOST=localhost)
    # so the app talks to the compose services instead of the host.
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # Honour X-Forwarded-For from the host proxy. Opt-in: off means the socket
      # peer is used, which is correct when nothing fronts the API.
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    # Loopback only: your host proxy connects here. Never bind 0.0.0.0 — Docker
    # publishes bypass ufw, which would put the API straight on the internet.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Schema must exist before the API serves a request.
      migrate:
        condition: service_completed_successfully

  # Polls the transactional outbox table and delivers due messages (SMTP).
  # Same image as the API; only the entrypoint differs.
  worker:
    build:
      context: .
    image: go-react-monorepo:local
    command: ["./worker"]
    restart: always
    networks: [app-net]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    # The worker only touches Postgres (outbox); it never uses Redis, so no
    # redis dependency.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18.1
    env_file:
      - .env
    networks: [app-net]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go-react-monorepo}
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker, so the volume
      # mounts at /var/lib/postgresql rather than /var/lib/postgresql/data. An
      # existing volume holds a 17 cluster at its root, which this image will not
      # read — it runs initdb instead, yielding an empty database. See
      # DEPLOYMENT.md, "Upgrading PostgreSQL across a major version".
      - postgres-data:/var/lib/postgresql
    # Not published. For pgAdmin / psql from outside, uncomment the loopback
    # mapping and tunnel it — `ssh -L 5432:127.0.0.1:5432 user@host`.
    # Never publish on 0.0.0.0: Docker publishes bypass ufw, so that would put
    # the database on the internet.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "${DB_USER:-postgres}" -d "${DB_NAME:-go-react-monorepo}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.6.2
    env_file:
      - .env
    networks: [app-net]
    # The sh wrapper below bypasses the image entrypoint's gosu drop, so pin the
    # container user explicitly (keeps Redis off root).
    user: redis
    # REDIS_PASSWORD must exist *inside the container* for the shell expansion
    # below and for the healthcheck. Compose interpolation alone only reads it
    # to build this file — it does not inject it, which silently left Redis
    # unauthenticated.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Compose cannot branch on ${REDIS_PASSWORD}, so let the shell decide: the
    # parameter expansion adds --requirepass only when REDIS_PASSWORD is non-empty
    # ($$ escapes compose interpolation; the value arrives via the env above).
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticate only when a password is configured, otherwise plain ping.
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot goose migration job. It runs after Postgres is healthy and before
  # the API and worker start, so neither ever sees an empty schema.
  #
  # The image's entrypoint hardcodes `-dir=/migrations` and runs
  # `goose ${GOOSE_VERBOSE:+-v} -dir=/migrations ${GOOSE_COMMAND:-up}`, so only
  # GOOSE_DRIVER/GOOSE_DBSTRING are needed here — no command or entrypoint.
  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.19.2
    env_file:
      - .env
    networks: [app-net]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=${DB_PORT:-5432}
        user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot: never restart, and a failure must block the app tier.
    restart: "no"

  # Twice-daily logical backups, offsite-only. Built on the rclone image (Alpine)
  # with postgresql18-client from apk — ~100MB vs ~300MB for the postgres image
  # plus apt rclone, and rclone is preinstalled. One busybox-crond job streams
  # `pg_dump -Fc | rclone copyto` straight to a private R2 bucket; there is no
  # local copy and no on-host volume. Retention is an R2 lifecycle rule on
  # BACKUP_PREFIX, not pruned here.
  #
  # The crontab is baked at /etc/crontabs/root (busybox's default). cron does not
  # inherit the container environment, so the entrypoint snapshots the DB_* and
  # BACKUP_R2_* variables into /etc/backup.env, which the job sources.
  #
  # BACKUP_R2_BUCKET must be a SEPARATE, PRIVATE R2 bucket. It must never be
  # R2_BUCKET: that bucket is served from a public URL, and the script
  # hard-refuses to upload to it.
  backup:
    build:
      context: ./deployment/backup
    image: go-react-monorepo-backup:local
    networks: [app-net]
    env_file:
      - .env
    environment:
      # .env sets DB_HOST=localhost for bare-metal; inside compose the database
      # is the `postgres` service.
      DB_HOST: postgres
      # cron fires in the container's local time; pin it so "03:15" and "15:15" are known
      # wall clock rather than UTC.
      TZ: ${TZ:-Asia/Jakarta}
    # No published ports and no volumes: the sidecar only reaches the database
    # and R2, and keeps nothing on the host.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
